name: Materialize long-scroll portfolio

on:
  push:
    branches: [design/long-scroll-portfolio]
    paths:
      - ".reconstruct/**"
      - ".github/workflows/materialize-long-scroll.yml"

permissions:
  contents: write

concurrency:
  group: materialize-long-scroll
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: design/long-scroll-portfolio
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct reviewed source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .reconstruct/part-* | base64 --decode > /tmp/long-scroll-materialize.tar.gz
          echo "7a49d430bc2d2d5b23e553d1007f4aef0b272e4ae139bc96c7e7fea286ca3de0  /tmp/long-scroll-materialize.tar.gz" | sha256sum --check
          tar -xzf /tmp/long-scroll-materialize.tar.gz
          rm -rf .reconstruct
          rm .github/workflows/materialize-long-scroll.yml
          chmod +x .agents/skills/portfolio-evidence/scripts/assert-site.mjs

      - name: Run deterministic portfolio checks
        run: npm test

      - name: Commit materialized portfolio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: restore long-scroll evidence portfolio"
          git push origin HEAD:design/long-scroll-portfolio
