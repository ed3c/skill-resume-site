name: Apply local Forgejo website copy

on:
  push:
    branches:
      - content/local-forgejo-copy

permissions:
  contents: write

jobs:
  update-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: content/local-forgejo-copy
          fetch-depth: 0

      - name: Apply exact copy changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "index.html": [
                  (
                      "This private implementation carries state-machine control, receipt-derived status, stacked-delivery checks, origin verification, and bounded Agent consumer canaries. The public résumé does not expose its repository URL, credentials, private adapters, vendor bindings, employer data, or client data.",
                      "This implementation stays in a local Forgejo-only lane. GitHub receives only the public evidence summary through the dual-forge publication flow.",
                  ),
                  (
                      "這項私有實作包含狀態機控制、由 Receipt 推導的狀態、Stacked Delivery 檢查、Origin Verification 與有邊界的 Agent Consumer Canary。公開履歷不揭露私有 Repository URL、憑證、私有 Adapter、Vendor Binding、雇主或客戶資料。",
                      "這項實作留在本地 Forgejo 專用線；GitHub 只透過 Dual-Forge 發布流程接收公開證據摘要。",
                  ),
                  (
                      "Each project is presented as a problem, a system boundary, and an evidence state. Public work links to code. Private work shows only transferable capability.",
                      "Each project is presented as a problem, a system boundary, and an evidence state. Public work links to code. Local Forgejo work appears only as a public evidence summary.",
                  ),
                  (
                      "每個專案都以問題、系統邊界與證據狀態呈現。公開作品連到程式碼；私有作品只展示可轉移能力。",
                      "每個專案都以問題、系統邊界與證據狀態呈現。公開作品連到程式碼；本地 Forgejo 工作只呈現公開證據摘要。",
                  ),
                  ("Disclosure boundary.", "Local isolation."),
                  ("揭露邊界。", "本地物理隔離。"),
                  (
                      "The page does not expose client names, employer details, credentials, device identifiers, private repository links, vendor bindings, or paid-library inventory.",
                      "Private implementation stays in a local Forgejo-only lane. The public GitHub portfolio carries only the approved projection produced by the dual-forge delivery flow.",
                  ),
                  (
                      "頁面不公開客戶名稱、公司資訊、憑證、裝置識別碼、私有 Repo 連結、供應商綁定或付費 Library 清單。",
                      "私有實作留在本地 Forgejo 專用線；公開 GitHub 履歷只承載由 Dual-Forge Delivery Flow 產生的公開投影。",
                  ),
              ],
              "assets/evidence-matrix.js": [
                  (
                      "Private evidence for state-machine control, receipt-derived status, Git Town delivery checks, origin-verification contracts, and bounded Claude/Codex consumer canaries. Public copy deliberately omits private adapters, credentials, and internal bindings.",
                      "State-machine control, receipt-derived status, Git Town delivery checks, origin-verification contracts, and bounded Claude/Codex consumer canaries stay in the local Forgejo lane. The public GitHub portfolio carries only the approved evidence summary.",
                  ),
                  (
                      "私有實作證據包含狀態機控制、由 Receipt 推導狀態、Git Town 交付檢查、Origin Verification Contract，以及有邊界的 Claude／Codex Consumer Canary。公開履歷刻意不揭露私有 Adapter、Credential 與內部 Binding。",
                      "狀態機控制、由 Receipt 推導狀態、Git Town 交付檢查、Origin Verification Contract，以及有邊界的 Claude／Codex Consumer Canary 留在本地 Forgejo 線；公開 GitHub 履歷只承載核准的證據摘要。",
                  ),
                  (
                      "Private repository link withheld from the public résumé.",
                      "Local Forgejo lane · public evidence summary only.",
                  ),
                  (
                      "公開履歷不提供私有 Repository 連結。",
                      "本地 Forgejo 線 · 僅呈現公開證據摘要。",
                  ),
              ],
              "data/portfolio.json": [
                  (
                      "Private implementation evidence for repeatable device control, integration, and Agent-assisted testing. Employer, client, and internal product details are not published.",
                      "Implementation details for repeatable device control, integration, and Agent-assisted testing stay in the local Forgejo lane. The public portfolio uses only a capability summary.",
                  ),
                  (
                      "私有實作證據涵蓋可重複裝置控制、整合與 Agent 輔助測試；不公開雇主、客戶與內部產品資訊。",
                      "可重複裝置控制、整合與 Agent 輔助測試的實作細節留在本地 Forgejo 線；公開履歷只使用能力摘要。",
                  ),
                  (
                      "Private evidence for state-machine control, receipt-derived status, stacked delivery checks, origin verification, and bounded Agent consumer canaries. Private adapters and bindings stay undisclosed.",
                      "State-machine control, receipt-derived status, stacked delivery checks, origin verification, and bounded Agent consumer canaries stay in the local Forgejo lane. The public portfolio uses only an evidence summary.",
                  ),
                  (
                      "私有證據包含狀態機控制、Receipt-derived Status、Stacked Delivery 檢查、Origin Verification 與有邊界的 Agent Consumer Canary；私有 Adapter 與 Binding 不公開。",
                      "狀態機控制、Receipt-derived Status、Stacked Delivery 檢查、Origin Verification 與有邊界的 Agent Consumer Canary 留在本地 Forgejo 線；公開履歷只使用證據摘要。",
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected exactly one occurrence, found {count}: {old[:80]}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          combined = "\n".join(Path(name).read_text(encoding="utf-8") for name in replacements)
          forbidden = [
              "頁面不公開客戶名稱、公司資訊、憑證、裝置識別碼、私有 Repo 連結、供應商綁定或付費 Library 清單。",
              "The page does not expose client names, employer details, credentials, device identifiers, private repository links, vendor bindings, or paid-library inventory.",
              "Public copy deliberately omits private adapters, credentials, and internal bindings.",
              "Private repository link withheld from the public résumé.",
          ]
          for phrase in forbidden:
              if phrase in combined:
                  raise SystemExit(f"retired webpage copy still present: {phrase}")
          PY

      - name: Verify copy-only release
        shell: bash
        run: |
          set -euo pipefail
          npm test
          git diff --check
          git diff --exit-code -- . ':!index.html' ':!assets/evidence-matrix.js' ':!data/portfolio.json' ':!.github/workflows/apply-local-forgejo-copy.yml'

      - name: Commit copy update and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-local-forgejo-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/evidence-matrix.js data/portfolio.json .github/workflows/apply-local-forgejo-copy.yml
          git commit -m "copy: describe the local Forgejo boundary"
          git push origin HEAD:content/local-forgejo-copy
