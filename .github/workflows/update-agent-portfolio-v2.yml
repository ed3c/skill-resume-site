## Delivery measurement contract

The portfolio does not publish invented capability-completion percentages. Capability evidence remains categorical: production background, public implementation, private implementation, or next proof required.

The only percentages are delivery-evaluation weights adapted from the uploaded Agent application and Vibe Coding assessment matrix:

| Dimension | Weight | Evidence used for scoring |
|---|---:|---|
| Control flow and state governance | 25% | DAG/state machine, explicit stop rules, retry bounds, rollback |
| Tool boundaries and idempotency | 20% | Typed single-purpose tools, failure modes, compact returns, idempotency |
| Context budget and memory | 20% | Working-state separation, pruning, structured extraction, overflow fallback |
| Fault tolerance, self-repair, and HITL | 20% | Timeouts, bounded repair, circuit breaker, deterministic guards, human approval |
| Evals and observability | 15% | Assertions, Golden Dataset, semantic judge, traces, token and latency evidence |

Each dimension receives a 0–100 evidence-backed score. The weighted score is `sum(dimension score × weight)`. Hard gates override the average: Safety must equal 100%; Accuracy delta must be non-negative; LLM Judge delta must be at least -0.02; Token growth must not exceed 15%; Latency growth must not exceed 20%.

The delivery rule is: propose, execute, read the deterministic failure, repair the exact condition, and rerun until the agreed checks pass.

### Drop-in Remote Agent and Git Town Stack PRs

A Drop-in Remote Agent enters an existing repository for one bounded outcome, reads only relevant context, changes the smallest file set, produces tests and evidence, and leaves an asynchronous handoff. Git Town Stack PRs split a dependent outcome into atomic reviewable branches; independent work remains sibling branches rather than being forced into a stack.
