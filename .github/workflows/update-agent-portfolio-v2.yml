          assertion = r'''#!/usr/bin/env node
import { readFile, readdir } from "node:fs/promises";
import path from "node:path";
import process from "node:process";

const root = process.cwd();
const errors = [];
const html = await readFile(path.join(root, "index.html"), "utf8");
const css = await readFile(path.join(root, "styles.css"), "utf8");
const data = JSON.parse(await readFile(path.join(root, "data/portfolio.json"), "utf8"));

const requiredHtml = [
  "agent-shield-monorepo",
  "https://github.com/ed3c/agent-shield-monorepo",
  "Drop-in Remote Agent",
  "Git Town Stack PRs",
  "id=\"measurement\"",
  "Control flow &amp; state governance",
  "Tool boundaries &amp; idempotency",
  "Context budget &amp; memory",
  "Fault tolerance, self-repair &amp; HITL",
  "Evals &amp; observability",
  "Execute the result. Read the deterministic failure. Repair the exact condition. Re-run until the agreed checks pass.",
  "執行結果、讀取確定性失敗、修正精確條件，再重跑到約定檢查通過。",
  "Vibe Coding vs. Agentic Architect",
];
for (const fragment of requiredHtml) {
  if (!html.includes(fragment)) errors.push(`index.html must include: ${fragment}`);
}

const forbidden = new RegExp(["ix", "agy"].join("[-_ ]+"), "i");
for (const file of await collectTextFiles(root)) {
  const text = await readFile(file, "utf8");
  if (forbidden.test(text)) errors.push(`retired repository information remains in ${path.relative(root, file)}`);
}

const weights = data.measurementContract?.weights || {};
const expectedWeights = {
  controlFlowAndStateGovernance: 25,
  toolBoundariesAndIdempotency: 20,
  contextBudgetAndMemory: 20,
  faultToleranceSelfRepairAndHITL: 20,
  evalsAndObservability: 15,
};
for (const [key, value] of Object.entries(expectedWeights)) {
  if (weights[key] !== value) errors.push(`measurement weight ${key} must equal ${value}`);
}
if (Object.values(weights).reduce((sum, value) => sum + Number(value || 0), 0) !== 100) {
  errors.push("measurement weights must total 100");
}

const gates = data.measurementContract?.hardGates || {};
for (const [key, value] of Object.entries({
  safetyGuardrailPassRate: "100%",
  accuracyDelta: ">= 0.0%",
  llmJudgeDelta: ">= -0.02",
  tokenIncrease: "<= 15%",
  latencyIncrease: "<= 20%",
})) {
  if (gates[key] !== value) errors.push(`hard gate ${key} must equal ${value}`);
}

const shield = (data.projects || []).find((project) => project.id === "agent-shield-monorepo");
if (!shield) errors.push("portfolio data must include agent-shield-monorepo");
if (shield?.url !== null) errors.push("private project url must remain null in the rendered project list");
if (shield?.referenceUrl !== "https://github.com/ed3c/agent-shield-monorepo") errors.push("agent-shield reference URL is missing");

function inspectForInventedCompletion(value, trail = []) {
  if (!value || typeof value !== "object") return;
  for (const [key, child] of Object.entries(value)) {
    const next = [...trail, key];
    if (/completion|percentComplete|progressPercent/i.test(key) && typeof child === "number") {
      errors.push(`invented capability completion percentage at ${next.join(".")}`);
    }
    inspectForInventedCompletion(child, next);
  }
}
inspectForInventedCompletion(data);

for (const fragment of [
  ".measurement-definition-grid",
  ".score-matrix",
  ".vibe-comparison",
  ".evidence-map",
  "overflow-wrap: anywhere",
  "@media (max-width: 420px)",
]) {
  if (!css.includes(fragment)) errors.push(`responsive measurement CSS must include: ${fragment}`);
}

if (errors.length) {
  console.error("Measured Agent portfolio assertions failed:\n");
  for (const error of errors) console.error(`- ${error}`);
  process.exit(1);
}

console.log("Retired repository disclosure: clean");
console.log("Agent Shield evidence mapping: pass");
console.log("PDF-weighted measurement contract: pass");
console.log("Vibe Coding versus Agentic Architect explanation: pass");
console.log("Responsive measurement presentation: pass");

async function collectTextFiles(directory) {
  const output = [];
  for (const entry of await readdir(directory, { withFileTypes: true })) {
    if (entry.name === ".git" || entry.name === "node_modules" || entry.name === "_site") continue;
    const location = path.join(directory, entry.name);
    if (entry.isDirectory()) output.push(...await collectTextFiles(location));
    else if (/\.(?:html|css|js|mjs|json|md|ya?ml|txt|xml)$/i.test(entry.name)) output.push(location);
  }
  return output;
}
