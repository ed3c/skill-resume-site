name: Portfolio CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run deterministic checks
        run: npm run check

      - name: Build static artifact
        run: |
          mkdir -p _site
          cp index.html styles.css main.js 404.html manifest.webmanifest robots.txt sitemap.xml _site/
          cp -R assets fonts data docs _site/

      - name: Upload verified site artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-resume-site
          path: _site
