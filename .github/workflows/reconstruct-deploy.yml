name: Reconstruct portfolio source

on:
  push:
    branches: [design/taste-system-refresh]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconstruct-portfolio
  cancel-in-progress: true

jobs:
  reconstruct:
    if: ${{ !contains(github.event.head_commit.message || '', '[reconstruct complete]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: design/taste-system-refresh
          fetch-depth: 0

      - name: Reconstruct exact source files
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/index.html.*.part | base64 --decode | gzip --decompress > index.html
          cat .deploy/styles.css.*.part | base64 --decode | gzip --decompress > styles.css
          cat .deploy/main.js.*.part | base64 --decode | gzip --decompress > main.js
          rm -rf .deploy
          rm -f .github/workflows/reconstruct-deploy.yml

      - name: Run deterministic checks
        run: npm run check

      - name: Commit reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: materialize cinematic portfolio [reconstruct complete]"
          git push origin HEAD:design/taste-system-refresh
